<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smoothies</title>

    <link rel="stylesheet" href="CSS/style.css">

</head>
<body>
    <main>
        <div class="item active" style="background-color: #FAA7DC;">
            <div class="title">Morango</div>
            <img src="img/morango.png" class="fruit">
            <img src="img/smothie rosa.png" class="smoothie">
        </div>

        <div class="item" style="background-color: #F9E598;">
            <div class="title">Manga</div>
            <img src="img/manga cortada.webp" class="fruit">
            <img src="img/smootie frutas amarelas 2.webp" class="smoothie">
        </div>

        <div class="item" style="background-color: #D3E47B;">
            <div class="title">Kiwi</div>
            <img src="img/kiwi.png" class="fruit">
            <img src="img/smootie verde.webp" class="smoothie">
        </div>

        <div class="item hidden" style="background-color: #E59BE6;">
            <div class="title">Bluebarry</div>
            <img src="img/blueberries.png" class="fruit">
            <img src="img/smooties roxos.png" class="smoothie">
        </div>

        <div class="seta">
            <button id="prev"> < </button>
            <button id="next"> > </button>
        </div>

    </main>

<script src="./JavaScript/script.js"></script>
    
</body>
</html>
